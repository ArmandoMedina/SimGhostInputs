[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasma-inputs"
version = "0.1.0"
description = "Compara tus inputs de simracing contra una vuelta de referencia, por distancia."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
xlsx = ["openpyxl"]

[project.scripts]
fantasma = "fantasma.cli:main"

[tool.setuptools.packages.find]
include = ["fantasma*"]
