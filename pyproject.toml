[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasma-inputs"
version = "0.1.0"
description = "Compara tus inputs de simracing contra una vuelta de referencia, por distancia."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# pip install -e ".[xlsx]"      -> leer archivos .xlsx de MoTeC i2
xlsx    = ["openpyxl"]
# pip install -e ".[overlay]"   -> generar el HUD de video (fantasma overlay)
overlay = ["Pillow>=10"]
# pip install -e ".[charts]"    -> graficas ghost y mapa de delta (fantasma compare)
charts  = ["matplotlib>=3.7"]
# pip install -e ".[full]"      -> todo lo anterior
full    = ["openpyxl", "Pillow>=10", "matplotlib>=3.7"]

[project.scripts]
fantasma = "fantasma.cli:main"

[tool.setuptools.packages.find]
include = ["fantasma*"]
