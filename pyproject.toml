[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasma-inputs"
version = "2.1.1"
description = "Compara tus inputs de simracing contra una vuelta de referencia, por distancia."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# pip install -e ".[xlsx]"      -> leer archivos .xlsx de MoTeC i2
xlsx    = ["openpyxl>=3,<4"]
# pip install -e ".[overlay]"   -> generar el HUD de video (fantasma overlay)
overlay = ["Pillow>=10,<12", "matplotlib>=3.7,<4", "numpy>=1.24,<3"]
# pip install -e ".[charts]"    -> graficas ghost y mapa de delta (fantasma compare)
charts  = ["matplotlib>=3.7,<4"]
# pip install -e ".[ui-ng]"     -> interfaz NiceGUI
ui-ng   = ["nicegui>=3.14,<4", "pandas>=2,<3", "pywebview>=5,<6"]
# pip install -e ".[sync]"      -> auto-deteccion de offset video/telemetria (fantasma compose --auto-sync)
sync    = ["scipy>=1.11,<2", "numpy>=1.24,<3"]
# pip install -e ".[voice]"     -> generar pace notes de voz con edge-tts (fantasma pacenotes --mode voice)
voice   = ["edge-tts>=6,<7"]
# pip install -e ".[full]"      -> todo lo anterior
full    = ["openpyxl>=3,<4", "Pillow>=10,<12", "matplotlib>=3.7,<4", "numpy>=1.24,<3", "pandas>=2,<3", "scipy>=1.11,<2", "edge-tts>=6,<7", "nicegui>=3.14,<4", "pywebview>=5,<6"]
# pip install -e ".[test]"      -> suite de pruebas automatizadas (solo desarrollo)
test    = ["pytest>=8,<9", "pytest-asyncio>=0.21,<1"]
# pip install -e ".[dev]"       -> herramientas de desarrollo: linter + formatter + smoke visual (solo desarrollo)
dev     = ["ruff>=0.15,<1", "playwright>=1.40,<2", "Pillow>=10,<12"]

[project.scripts]
fantasma = "fantasma.cli:main"
fantasma-ng = "fantasma.ui.ng_app:run"

[tool.setuptools.packages.find]
include = ["fantasma*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Conjunto de reglas a proposito CORTO y de alta senal (ver docs/benchmark-linter.md):
#   F = pyflakes  -> imports/variables sin usar, nombres indefinidos, f-strings vacios.
#                    Es la "basura" real que queremos atajar antes de subir.
#   I = isort     -> orden de imports, auto-arreglable y sin drama.
# El formateo de espacios/comillas lo hace `ruff format`, NO las reglas E/W de
# pycodestyle: por eso NO se activan E701/E741, que sobre codigo que ya funciona
# solo serian ruido (one-liners y nombres de una letra intencionales). Ampliar a
# B (bugbear) o UP (pyupgrade) cuando aporte, no por default.
select = ["F", "I"]
