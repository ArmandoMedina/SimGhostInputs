name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    # Barrera determinista: ruff (lint + formato) en cada push/PR. Ver docs/benchmark-linter.md.
    # 'ruff check' = reglas F+I (basura real). 'ruff format --check' = formato canonico
    # (baseline aplicado, por eso ya se puede gatear).
    runs-on: ubuntu-latest
    steps:
      # actions en Node 24 (checkout@v7, setup-python@v6); las v4/v5 quedaban en
      # Node 20 (deprecado). Aviso visto en el run de CI del 2026-06-26.
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  pytest:
    # Windows es la plataforma objetivo del proyecto
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with test extras
        # [ui] habilita el smoke de Streamlit; [sync] aporta numpy/scipy para los
        # tests puros de viz/sync. ffmpeg NO es necesario: los tests no lo invocan.
        run: pip install -e ".[test,ui,sync]"

      - name: Run pytest
        run: pytest --ignore=tests/ui/visual

  visual-smoke:
    # Smoke visual del Paso 0 (Playwright + Chromium headless). ADR 0012.
    # Corre en ubuntu-latest como entorno CONSISTENTE -- es la fuente de verdad
    # del baseline. Si el layout del Paso 0 se mueve, este job truena.
    # Solo una version de Python (3.12) porque lo que se verifica es el render
    # visual, no la compatibilidad de version.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package with visual extras
        # [ui] -> streamlit (para arrancar la app); [dev] -> playwright + Pillow
        run: pip install -e ".[test,ui,dev]"

      - name: Install Chromium browser
        run: playwright install chromium --with-deps

      - name: Run visual smoke tests
        run: pytest tests/ui/visual/ -v
