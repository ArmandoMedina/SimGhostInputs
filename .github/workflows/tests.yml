name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  pytest:
    # Windows es la plataforma objetivo del proyecto
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with test extras
        # [ui] habilita el smoke de Streamlit; [sync] aporta numpy/scipy para los
        # tests puros de viz/sync. ffmpeg NO es necesario: los tests no lo invocan.
        run: pip install -e ".[test,ui,sync]"

      - name: Run pytest
        run: pytest
