name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    # Barrera determinista: ruff (lint) en cada push/PR. Ver docs/benchmark-linter.md.
    # Solo 'ruff check' (reglas F+I); el 'ruff format --check' se sumara cuando se
    # aplique el baseline de formato (hoy reformatearia casi todo el repo).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check .

  pytest:
    # Windows es la plataforma objetivo del proyecto
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with test extras
        # [ui] habilita el smoke de Streamlit; [sync] aporta numpy/scipy para los
        # tests puros de viz/sync. ffmpeg NO es necesario: los tests no lo invocan.
        run: pip install -e ".[test,ui,sync]"

      - name: Run pytest
        run: pytest
