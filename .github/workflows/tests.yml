name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# ===> REQUIRED CHECKS (homologado del starter v0.5.0, ADR 0019): un job VERDE
#      no garantiza nada si no es requerido - un rojo no-requerido deja pasar el
#      merge igual (dolor real: "como pudiste hacer PR sin documentar?"). En el
#      ruleset de master marca required: 'audit', 'docs-graph', 'lint', 'pytest'.
#      Todo lo local (hooks, verificar.ps1) es aviso que se puede saltar; el
#      required check es el unico muro.

jobs:
  lint:
    # Barrera determinista: ruff (lint + formato) en cada push/PR. Ver docs/benchmark-linter.md.
    # 'ruff check' = reglas F+I (basura real). 'ruff format --check' = formato canonico
    # (baseline aplicado, por eso ya se puede gatear).
    runs-on: ubuntu-latest
    steps:
      # actions en Node 24 (checkout@v7, setup-python@v6); las v4/v5 quedaban en
      # Node 20 (deprecado). Aviso visto en el run de CI del 2026-06-26.
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  audit:
    # Blast-radius DETERMINISTA sobre el rango del PR (lee tools/blast-radius.json,
    # la ley de la seccion 8). Cierra la ventana que ni el hook (working tree) ni
    # verificar.ps1 (push local, saltable con --no-verify) cubren: commits que
    # llegaron al PR sin sus docs duenos. Debe ser REQUIRED CHECK (nota de arriba).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # historia completa: el auditor necesita el diff del rango
      - name: Auditar blast-radius (seccion 8)
        shell: pwsh
        run: ./tools/auditar-radius.ps1 -Range "origin/${{ github.base_ref }}...HEAD"

  docs-graph:
    # Auditor determinista del grafo de docs (product/ + engineering/): frontmatter,
    # wikilinks rotos, criterios de capacidades vigentes, huerfanos. Es el "muro" del
    # gate de documentacion que un subagente no puede saltar: se evalua sobre los .md
    # del repo, no sobre confiar en el agente. -Bloquea => exit 1 si hay BLOQUEA. ADR 0016.
    # Corre en pwsh sobre ubuntu (no necesita Python ni Windows; solo lee los .md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Auditar grafo de docs (product/ + engineering/)
        shell: pwsh
        run: ./tools/auditar.ps1 -Bloquea

  pytest:
    # Windows es la plataforma objetivo del proyecto
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with test extras
        # [ui-ng] agrega NiceGUI (UI v2.0). [sync] aporta numpy/scipy para viz/sync. ffmpeg NO es necesario.
        # [voice] aporta edge-tts, que los tests de build_voice_pack (anti-saturación de notas de voz)
        # importan para monkeypatchear Communicate (mockean la red/ffmpeg, pero necesitan el módulo).
        run: pip install -e ".[test,ui-ng,sync,voice]"

      - name: Run pytest
        run: pytest --ignore=tests/ui/visual

  visual-smoke:
    # Smoke de importacion de la UI NiceGUI v2.0. Verifica que todos los modulos
    # ng_* cargan sin error y que el entry point existe. Reemplaza el smoke visual
    # de Streamlit (ADR 0012) ahora que la UI migra a NiceGUI (ADR 0018).
    # Playwright completo contra NiceGUI se agrega en un PR posterior al merge.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install NiceGUI UI
        run: pip install -e ".[ui-ng,overlay]"

      - name: NiceGUI import smoke
        run: |
          python -c "
          from fantasma.ui import ng_app, ng_state, ng_helpers
          from fantasma.ui import ng_step0, ng_step1, ng_step2, ng_step3, ng_step4
          from fantasma.viz import hud_preview
          print('NiceGUI UI v2.0 imports OK')
          "

