name: release

on:
  release:
    types: [published]

jobs:
  build-installer:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -e ".[ui-ng,overlay,sync,xlsx]" nicegui-pack

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build bundle + installer
        run: python tools/build_installer.py --inno

      - name: Package portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/SimGhostInputs/* -DestinationPath "dist/SimGhostInputs-${{ github.event.release.tag_name }}-portable.zip"

      - name: Upload assets to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = (Get-Item dist/SimGhostInputs-*-Setup.exe).FullName
          $zip   = "dist/SimGhostInputs-${{ github.event.release.tag_name }}-portable.zip"
          gh release upload "${{ github.event.release.tag_name }}" $setup $zip --clobber
