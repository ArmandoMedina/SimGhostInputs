  <rect x="494" y="420" width="110" height="28" rx="5" fill="#fefce8" stroke="#ca8a04"/>
  <text x="549" y="438" text-anchor="middle" font-size="12">doc-gate</text>
  <text x="549" y="464" text-anchor="middle" font-size="9" fill="#92400e">CHANGELOG + checklist</text>
  <line x1="315" y1="478" x2="315" y2="554" stroke="#475569" marker-end="url(#ah)"/>

  <!-- ===== NUBE ===== -->
