  <text x="120" y="121" text-anchor="middle" font-size="9" fill="#475569">no</text>
  <rect x="236" y="140" width="176" height="56" rx="8" fill="#ffffff" stroke="#64748b"/>
  <text x="324" y="163" text-anchor="middle">Consolidar el cambio</text>
  <text x="324" y="180" text-anchor="middle" font-size="11.5">+ su test</text>
  <line x1="200" y1="168" x2="234" y2="168" stroke="#475569" marker-end="url(#ah)"/>
  <text x="218" y="160" text-anchor="middle" font-size="9" fill="#16a34a">sí = commit</text>
