    </marker>
  </defs>

  <text x="600" y="30" text-anchor="middle" font-size="20" font-weight="bold">Flujo de trabajo — SimGhostInputs</text>
  <text x="600" y="52" text-anchor="middle" font-size="12" fill="#475569">barreras deterministas · avisa temprano, bloquea al final · determinismo bloquea, juicio aconseja</text>

  <!-- Carriles -->
  <rect x="0" y="72" width="1200" height="212" fill="#eff6ff" stroke="#cbd5e1"/>
  <rect x="0" y="284" width="1200" height="212" fill="#fefce8" stroke="#cbd5e1"/>
  <rect x="0" y="496" width="1200" height="212" fill="#fef2f2" stroke="#cbd5e1"/>
